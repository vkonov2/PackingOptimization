[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "packing-optimization-demo"
version = "0.1.0"
description = "Weighted rectangle packing demo using OR-Tools."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Demo User" }]
dependencies = [
    "matplotlib==3.8.4",
    "numpy==1.26.4",
    "ortools==9.11.4210",
    "pandas==2.2.2",
    "gradio==3.50.2",
    "setuptools==69.5.1",
]

[project.scripts]
rectangle-packing = "rectangle_packing:main"
rectangle-packing-gradio = "rectangle_packing_gradio:main"

[tool.setuptools]
py-modules = ["rectangle_packing", "rectangle_packing_gradio"]
