[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "packing-optimization-demo"
version = "0.1.0"
description = "Weighted rectangle and circle packing demos using OR-Tools."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Demo User" }]
dependencies = [
    "matplotlib==3.8.4",
    "numpy==1.26.4",
    "ortools==9.11.4210",
]

[project.scripts]
rectangle-packing = "rectangle_packing:main"
circle-packing = "circle_packing:main"

[tool.setuptools]
py-modules = ["rectangle_packing", "circle_packing"]
